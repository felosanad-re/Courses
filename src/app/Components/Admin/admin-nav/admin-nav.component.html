<!-- Main Navbar -->
<nav class="admin-navbar">
  <div class="admin-navbar__container">
    <div class="admin-navbar__left">
      <!-- Menu toggle: emits sidebarToggle to open/close sidebar on mobile -->
      <button class="admin-navbar__menu-toggle" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>

      <a class="admin-navbar__brand" routerLink="/admin/dashboard">
        <div class="admin-navbar__logo">
          <i class="pi pi-shield"></i>
        </div>
        <span class="admin-navbar__name">Coursat</span>
        <span class="admin-navbar__badge">Admin</span>
      </a>
    </div>

    <!-- Center: Search -->
    <div class="admin-navbar__center">
      <div class="admin-navbar__search">
        <i class="pi pi-search"></i>
        <input
          type="text"
          placeholder="Search courses, users, instructors..."
        />
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="admin-navbar__right">
      <button class="admin-navbar__icon-btn">
        <i class="pi pi-bell"></i>
        <span class="admin-navbar__notification-dot"></span>
      </button>

      <button class="admin-navbar__icon-btn">
        <i class="pi pi-envelope"></i>
      </button>

      <div class="admin-navbar__user">
        <button class="admin-navbar__user-btn" (click)="toggleUserMenu()">
          <div class="admin-navbar__avatar">
            <i class="pi pi-user"></i>
          </div>
          <span class="admin-navbar__username">{{ userName }}</span>
          <i class="pi pi-chevron-down"></i>
        </button>

        <div
          class="admin-navbar__user-dropdown"
          [class.admin-navbar__user-dropdown--open]="isUserMenuOpen"
        >
          <a routerLink="/admin/profile">
            <i class="pi pi-user-edit"></i>
            Profile
          </a>
          <a routerLink="/admin/settings">
            <i class="pi pi-cog"></i>
            Settings
          </a>
          <hr />
          <button (click)="logout()">
            <i class="pi pi-sign-out"></i>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<app-sidebar
  [isSidebarOpen]="isSidebarOpen"
  [isSidebarCollapsed]="isSidebarCollapsed"
  [navItems]="navItems"
  [userName]="userName"
  [userRole]="userRole"
  (sidebarToggle)="toggleSidebar()"
  (sidebarCollapseToggle)="toggleSidebarCollapse()"
  (sidebarCloseOnMobile)="closeSidebarOnMobile()"
/>
